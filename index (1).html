<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar Engine & Dictionary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='%232563eb' stroke-width='8'/><path d='M30 55 L45 70 L75 35' stroke='%232563eb' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <style>
        /* ===== RESET & VARIABLES ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #4338ca;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --clause-bg: #f8fafc;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --scroll-thumb: #cbd5e1;
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --primary-light: #a5b4fc;
            --primary-dark: #4f46e5;
            --bg-body: #0b1120;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --clause-bg: #2d3a4f;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.6);
            --scroll-thumb: #475569;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 32px 20px;
            transition: background var(--transition), color var(--transition);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 1040px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            padding: 32px 36px;
            transition: background var(--transition), border-color var(--transition);
            position: relative;
        }

        /* ===== HEADER ===== */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left svg {
            width: 32px;
            height: 32px;
            fill: var(--primary);
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 50%;
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background: var(--clause-bg);
            color: var(--primary);
        }
        .theme-toggle svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* ===== TABS ===== */
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .tab-button {
            padding: 10px 18px;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            border-radius: 30px;
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: -1px;
            white-space: nowrap;
        }
        .tab-button:hover {
            color: var(--text-main);
            background: var(--clause-bg);
        }
        .tab-button.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeUp 0.3s ease-out;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-main);
            border-left: 4px solid var(--primary);
            padding-left: 14px;
        }

        h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* ===== FORMS ===== */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="text"],
        select,
        textarea {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: var(--bg-input);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
        }
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .clause-group {
            background: var(--clause-bg);
            padding: 18px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
            transition: background var(--transition);
        }

        .form-type-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px 28px;
            padding: 14px 20px;
            background: var(--clause-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .form-type-group label {
            font-weight: 400;
            color: var(--text-main);
            gap: 6px;
            cursor: pointer;
        }
        .form-type-group input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .wh-word-group {
            transition: opacity 0.25s ease, max-height 0.3s ease, margin 0.3s ease, padding 0.3s ease;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .wh-word-group.visible {
            opacity: 1;
            max-height: 60px;
            margin-left: 4px;
            padding-left: 20px;
            border-left: 2px solid var(--border-color);
        }
        .wh-word-group input {
            width: 160px;
        }

        .tooltip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--text-muted);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            cursor: help;
            position: relative;
            flex-shrink: 0;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 240px;
            background: #1e293b;
            color: #f1f5f9;
            text-align: left;
            border-radius: 8px;
            padding: 12px 14px;
            position: absolute;
            z-index: 20;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.8rem;
            font-weight: 400;
            box-shadow: var(--shadow-md);
            pointer-events: none;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border: 5px solid transparent;
            border-top-color: #1e293b;
        }

        /* ===== BUTTONS ===== */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .generate-btn {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
            flex: 1 1 auto;
        }
        .generate-btn:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
        }

        .example-btn,
        .clear-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border-color: var(--border-color);
        }
        .example-btn:hover,
        .clear-btn:hover {
            background: var(--clause-bg);
            border-color: var(--text-muted);
        }
        .danger-btn {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }
        .danger-btn:hover {
            background: #dc2626;
            border-color: #dc2626;
        }

        /* ===== OUTPUT ===== */
        .output-container {
            margin-top: 28px;
            position: relative;
        }

        .output-box {
            padding: 20px 24px;
            padding-right: 80px;
            background: var(--clause-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            min-height: 60px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            word-break: break-word;
            transition: background var(--transition), border-color var(--transition);
        }

        .action-buttons {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 34px;
            height: 34px;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        .icon-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .icon-btn.copied {
            background: #ecfdf5;
            color: #059669;
            border-color: #059669;
        }

        .feedback-note {
            font-size: 0.85rem;
            color: #d97706;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        /* ===== WORD LIST ===== */
        .word-list-container {
            max-height: 620px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .word-list-container::-webkit-scrollbar {
            width: 8px;
        }
        .word-list-container::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }

        .level-group {
            margin-bottom: 32px;
        }
        .level-group h3 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }
        .count-badge {
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .word-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
        }
        .word-item:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* ===== DICTIONARY ===== */
        .dict-top-section {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 18px;
        }
        .dict-word-container {
            flex: 1;
        }
        .dict-word {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
        }
        .dict-phonetic {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-right: 10px;
        }
        .pronounce-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            transition: all var(--transition);
        }
        .pronounce-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .pronounce-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .dict-image-container {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: none;
            background: var(--clause-bg);
        }
        .dict-image-container.has-image {
            display: block;
        }
        .dict-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dict-pos-group {
            margin-bottom: 20px;
        }
        .dict-pos {
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        .dict-def-list {
            margin: 6px 0 0 20px;
            padding: 0;
            list-style-type: disc;
        }
        .dict-def-list li {
            margin-bottom: 10px;
            font-size: 0.98rem;
        }
        .dict-example {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 4px;
            padding-left: 12px;
            border-left: 2px solid var(--border-color);
        }
        .dict-extra-info {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }
        .dict-label {
            font-weight: 600;
            color: var(--text-main);
            margin-right: 6px;
        }
        .tag-cloud {
            display: inline;
        }
        .tag {
            display: inline-block;
            margin-right: 4px;
            color: var(--text-muted);
            text-decoration: none;
        }
        .tag::after {
            content: ",";
        }
        .tag:last-child::after {
            content: "";
        }
        .dict-error {
            color: #ef4444;
            font-weight: 500;
            text-align: center;
            padding: 20px 0;
        }
        .dict-error a {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* ===== DICTATION ===== */
        .recording-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .recording-indicator.active {
            opacity: 1;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* ===== FLASHCARDS ===== */
        .flashcard-container {
            perspective: 1000px;
            height: 340px;
            margin: 20px 0 28px;
        }
        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            cursor: pointer;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 28px;
            box-sizing: border-box;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background: var(--clause-bg);
        }
        .fc-word {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .fc-def {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-main);
            max-height: 200px;
            overflow-y: auto;
            width: 100%;
            text-align: left;
        }
        .fc-hint {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 12px 8px;
            }
            .container {
                padding: 20px 16px;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
            .header-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-left h1 {
                font-size: 1.4rem;
            }
            .tab-nav {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 4px;
                gap: 4px;
                scrollbar-width: none;
            }
            .tab-nav::-webkit-scrollbar {
                display: none;
            }
            .tab-button {
                font-size: 0.8rem;
                padding: 8px 14px;
                white-space: nowrap;
            }
            .input-grid {
                grid-template-columns: 1fr;
            }
            .button-group {
                flex-direction: column;
            }
            .button-group button {
                width: 100%;
                justify-content: center;
            }
            .dict-top-section {
                flex-direction: column-reverse;
                align-items: stretch;
            }
            .dict-image-container {
                width: 100%;
                height: 180px;
            }
            .word-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            .output-box {
                font-size: 0.95rem;
                padding-right: 60px;
            }
            .action-buttons {
                top: 6px;
                right: 6px;
            }
            .icon-btn {
                width: 30px;
                height: 30px;
            }
            .wh-word-group.visible {
                max-height: 80px;
                padding-left: 10px;
                margin-left: 0;
                border-left: none;
            }
            .wh-word-group input {
                width: 120px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px 12px;
            }
            h2 {
                font-size: 1.15rem;
            }
            .dict-word {
                font-size: 1.6rem;
            }
            .fc-word {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header-row">
            <div class="header-left">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>

            const stativeVerbs = new Set(['be', 'believe', 'belong', 'consist', 'contain', 'cost', 'depend', 'dislike',
                'doubt', 'exist', 'fit', 'hate', 'have', 'hear', 'know', 'like', 'love', 'matter', 'mean', 'need',

            // 2.  UTILITY FUNCTIONS

            function isThirdPersonSingular(s) {
                const l = s.toLowerCase().trim();
                return !['i', 'you', 'we', 'they'].includes(l) && !l.endsWith('s');
            }

            function conjugatePresent(v, s) {
                if (!isThirdPersonSingular(s)) return v;
                if (v === 'have') return 'has';
                if (v.endsWith('y') && !['a', 'e', 'i', 'o', 'u'].includes(v.slice(-2, -1))) return v.slice(0, -1) +
                'ies';
                if (v.endsWith('o') || v.endsWith('x') || v.endsWith('s') || v.endsWith('z') || v.endsWith('ch') || v
                    .endsWith('sh')) return v + 'es';
                return v + 's';
            }

            function getPast(v) {
                return irregularVerbs[v] ? irregularVerbs[v][0] :
                    (v.endsWith('e') ? v + 'd' :
                        (v.endsWith('y') && !['a', 'e', 'i', 'o', 'u'].includes(v.slice(-2, -1)) ? v.slice(0, -1) +
                            'ied' : v + 'ed'));
            }

            function getPastParticiple(v) {
                return irregularVerbs[v] ? irregularVerbs[v][1] : getPast(v);
            }

                if (v.endsWith('ie')) return v.slice(0, -2) + 'ying';
                if (v.endsWith('e') && !v.endsWith('ee') && v !== 'be') return v.slice(0, -1) + 'ing';
                const V = 'aeiou';
                if (v.length > 1 && !V.includes(v.slice(-2, -1)) && V.includes(v.slice(-1)) && !['w', 'x', 'y'].includes(v
                        .slice(-1))) return v + v.slice(-1) + 'ing';
                return v + 'ing';
            }

                if (t === 'past') {

                    return 'were';

            // --- Tenses ---
            document.getElementById('generate-tense-btn').addEventListener('click', function() {
                const s = document.getElementById('tense-subject').value.trim();
                const vInput = document.getElementById('tense-verb').value.trim().toLowerCase();
                const adv = document.getElementById('tense-adverb').value.trim();
                const o = document.getElementById('tense-object').value.trim();
                let t = document.getElementById('tense-selector').value;
                const f = document.querySelector('input[name="form-type"]:checked').value;
                const wh = document.getElementById('wh-word').value.trim();
                const out = document.getElementById('tense-output');

                if (!s || !vInput) { updateOutput(out, ''); return; }

                const vParts = vInput.split(' ');
                const modal = modalVerbs.has(vParts[0]) ? vParts[0] : null;
                const v = modal ? vParts.slice(1).join(' ') : vInput;
                let fb = '';
                if (!modal && /s$|d$|ing$/.test(v) && v.length > 3 && v !== 'bring') {
                    fb = `<div class="feedback-note">Warning: Please use the verb's base form.</div>`;
                }
                if (stativeVerbs.has(v) && t.includes('continuous')) {
                    const c = t.replace('-continuous', '');
                    fb += `<div class="feedback-note">Note: '${v}' is a stative verb. Continuous form avoided.</div>`;
                    t = c;
                }

                let adverbMid = '',
                    adverbEnd = '';
                if (adv) {
                    if (adverbsOfFrequency.has(adv.toLowerCase())) adverbMid = adv + ' ';
                    else adverbEnd = ' ' + adv;
                }

                let r = '';
                const whWord = (f === 'question' && wh) ? wh + ' ' : '';

                if (v === 'be' && (t === 'simple-present' || t === 'simple-past')) {
                    const aux = getToBe(t.includes('present') ? 'present' : 'past', s);
                    if (f === 'affirmative') r = `${s} ${aux} ${adverbMid}${o}${adverbEnd}`;
                    else if (f === 'negative') r = `${s} ${aux} not ${adverbMid}${o}${adverbEnd}`;
                    else r = `${whWord}${aux} ${s} ${adverbMid}${o}${adverbEnd}?`;
                    updateOutput(out, r.trim().replace(/\s+/g, ' ') + (r.includes('?') ? '' : '.'), fb);
                    return;
                }

                if (modal) {
                    if (f === 'affirmative') r = `${s} ${modal} ${adverbMid}${v} ${o}${adverbEnd}`;
                    else if (f === 'negative') r = `${s} ${modal} not ${adverbMid}${v} ${o}${adverbEnd}`;
                    else r = `${whWord}${modal} ${s} ${adverbMid}${v} ${o}${adverbEnd}?`;
                } else {
                    const auxDo = getDo(t.includes('present') ? 'present' : 'past', s);
                    const auxHave = getHave(s);
                    const auxToBe = getToBe(t.includes('present') ? 'present' : 'past', s);
                    switch (t) {
                        case 'simple-present':
                            if (f === 'affirmative') r =
                                `${s} ${adverbMid}${conjugatePresent(v, s)} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} ${auxDo} not ${adverbMid}${v} ${o}${adverbEnd}`;
                            else r = `${whWord}${auxDo} ${s} ${adverbMid}${v} ${o}${adverbEnd}?`;
                            break;
                        case 'simple-past':
                            if (f === 'affirmative') r = `${s} ${adverbMid}${getPast(v)} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} ${auxDo} not ${adverbMid}${v} ${o}${adverbEnd}`;
                            else r = `${whWord}${auxDo} ${s} ${adverbMid}${v} ${o}${adverbEnd}?`;
                            break;
                        case 'present-continuous':
                        case 'past-continuous':
                            if (f === 'affirmative') r =
                                `${s} ${auxToBe} ${adverbMid}${getIng(v)} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} ${auxToBe} not ${adverbMid}${getIng(v)} ${o}${adverbEnd}`;
                            else r = `${whWord}${auxToBe} ${s} ${adverbMid}${getIng(v)} ${o}${adverbEnd}?`;
                            break;
                        case 'present-perfect':
                            if (f === 'affirmative') r =
                                `${s} ${auxHave} ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} ${auxHave} not ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}`;
                            else r =
                                `${whWord}${auxHave} ${s} ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}?`;
                            break;
                        case 'past-perfect':
                            if (f === 'affirmative') r =
                                `${s} had ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} had not ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}`;
                            else r =
                                `${whWord}had ${s} ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}?`;
                            break;
                        case 'going-to-future':
                            if (f === 'affirmative') r =
                                `${s} ${getToBe('present', s)} ${adverbMid}going to ${v} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} ${getToBe('present', s)} not ${adverbMid}going to ${v} ${o}${adverbEnd}`;
                            else r =
                                `${whWord}${getToBe('present', s)} ${s} ${adverbMid}going to ${v} ${o}${adverbEnd}?`;
                            break;
                        case 'simple-future':
                            if (f === 'affirmative') r = `${s} will ${adverbMid}${v} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} will not ${adverbMid}${v} ${o}${adverbEnd}`;
                            else r = `${whWord}will ${s} ${adverbMid}${v} ${o}${adverbEnd}?`;
                            break;
                        case 'future-continuous':
                            if (f === 'affirmative') r =
                                `${s} will ${adverbMid}be ${getIng(v)} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} will not ${adverbMid}be ${getIng(v)} ${o}${adverbEnd}`;
                            else r = `${whWord}will ${s} ${adverbMid}be ${getIng(v)} ${o}${adverbEnd}?`;
                            break;
                        case 'future-perfect':
                            if (f === 'affirmative') r =
                                `${s} will have ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}`;
                            else if (f === 'negative') r =
                                `${s} will not have ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}`;
                            else r =
                                `${whWord}will ${s} have ${adverbMid}${getPastParticiple(v)} ${o}${adverbEnd}?`;
                            break;
                    }
                }
                updateOutput(out, r.trim().replace(/\s+/g, ' ') + (r.includes('?') ? '' : '.'), fb);
            });

            // --- If Clauses ---
            document.getElementById('generate-if-btn').addEventListener('click', function() {

            // --- Passive Voice ---
            document.getElementById('generate-passive-btn').addEventListener('click', function() {
                const s = document.getElementById('passive-subject').value.trim();
                const v = document.getElementById('passive-verb').value.trim().toLowerCase();
                const o = document.getElementById('passive-object').value.trim();
                let t = document.getElementById('passive-tense-selector').value;
                const out = document.getElementById('passive-output');

                if (!s || !v || !o) { updateOutput(out, ''); return; }

                let newS = objectToSubject[o.toLowerCase()] || o;
                if (newS !== o) newS = newS.charAt(0).toUpperCase() + newS.slice(1);
                const agent = subjectToObject[s.toLowerCase()] || s;
                let pV = '';
                switch (t) {
                    case 'simple-present':
                        pV = `${getToBe('present', newS)} ${getPastParticiple(v)}`;
                        break;
                    case 'present-continuous':
                        pV = `${getToBe('present', newS)} being ${getPastParticiple(v)}`;
                        break;
                    case 'present-perfect':
                        pV = `${getHave(newS)} been ${getPastParticiple(v)}`;
                        break;
                    case 'simple-past':
                        pV = `${getToBe('past', newS)} ${getPastParticiple(v)}`;
                        break;
                    case 'past-continuous':
                        pV = `${getToBe('past', newS)} being ${getPastParticiple(v)}`;
                        break;
                    case 'past-perfect':
                        pV = `had been ${getPastParticiple(v)}`;
                        break;
                    case 'simple-future':
                        pV = `will be ${getPastParticiple(v)}`;
                        break;
                    case 'future-perfect':

            // --- Reported Speech ---
            document.getElementById('generate-rs-btn').addEventListener('click', function() {
                const speaker = document.getElementById('rs-speaker').value.trim();
                const repVerb = document.getElementById('rs-verb').value;
                let direct = document.getElementById('rs-direct').value.trim();
                const out = document.getElementById('rs-output');

                if (!speaker || !direct) { updateOutput(out, ''); return; }

                const isSpeakerFemale = /she|mrs|miss|aunt|mother|mum|sister/i.test(speaker);
                const isSpeakerMale = /he|mr|uncle|father|dad|brother/i.test(speaker);

                const timeMap = {
                    'now': 'then',
                    'today': 'that day',
                    'tonight': 'that night',
                    'yesterday': 'the day before',
                    'tomorrow': 'the next day',
                    'this week': 'that week',
                    'last week': 'the week before',
                    'next week': 'the following week',
                    'here': 'there',
                    'this': 'that',
                    'these': 'those'
                };

                let newContent = direct;
                const subject = isSpeakerFemale ? 'she' : 'he';
                const object = isSpeakerFemale ? 'her' : 'him';
                const possessive = isSpeakerFemale ? 'her' : 'his';

                newContent = newContent.replace(/\bI\b/g, subject);
                newContent = newContent.replace(/\bmy\b/g, possessive);
                newContent = newContent.replace(/\bme\b/g, object);
                newContent = newContent.replace(/\bwe\b/g, 'they');
                newContent = newContent.replace(/\bour\b/g, 'their');
                newContent = newContent.replace(/\bus\b/g, 'them');

                const verbMap = [
                    { reg: /\bam\b/gi, rep: 'was' }, { reg: /\bis\b/gi, rep: 'was' }, { reg: /\bare\b/gi,
                        rep: 'were' },
                    { reg: /\bhave\b/gi, rep: 'had' }, { reg: /\bhas\b/gi, rep: 'had' },
                    { reg: /\bwill\b/gi, rep: 'would' }, { reg: /\bcan\b/gi, rep: 'could' },
                    { reg: /\bmay\b/gi, rep: 'might' }, { reg: /\bmust\b/gi, rep: 'had to' },
                    { reg: /\bdon't\b/gi, rep: 'didn\'t' }, { reg: /\bdoesn't\b/gi, rep: 'didn\'t' },
                    { reg: /\bwas\b/gi, rep: 'had been' }, { reg: /\bwere\b/gi, rep: 'had been' },
                    { reg: /\bdid\b/gi, rep: 'had done' }, { reg: /\bdidn't\b/gi, rep: 'hadn\'t' }
                ];
                verbMap.forEach(m => { newContent = newContent.replace(m.reg, m.rep); });

                newContent = newContent.replace(/(\b\w+ed\b)/g, function(match, p1, offset, string) {
                    const prev = string.substring(0, offset).trim().split(' ').pop();
                    return (prev === 'had' || prev === 'has' || prev === 'have') ? match : 'had ' + match;
                });

                for (const [key, val] of Object.entries(timeMap)) {
                    const reg = new RegExp(`\\b${key}\\b`, 'gi');
                    newContent = newContent.replace(reg, val);
                }

                updateOutput(out, `${speaker} ${repVerb} (that) ${newContent}.`);
            });

                    case 'whose':

                        exp = 'Shows possession.';

                    case 'where':

                if (target === 'subject') {

                updateOutput(out,

                    );

                    const res = await fetch(url, { headers: { 'Authorization': PEXELS_API_KEY } });
                    const data = await res.json();

            async function searchDict(manualWord) {
                const word = manualWord || document.getElementById('dict-word').value.trim();
                if (!word) return;
                if (manualWord) document.getElementById('dict-word').value = word;

                const out = document.getElementById('dict-output');

                    const dictUrl = CORS_PROXY + encodeURIComponent(
                        `https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                    const [dictRes, imageUrl] = await Promise.all([
                        fetch(dictUrl),
                        fetchPexelsImage(word)
                    ]);

                    if (!dictRes.ok) {
                        out.innerHTML =
                            `<div class="dict-error">Sorry, no definitions found for "${word}".<br><small>If you are running this file locally, please use a web server (e.g., VS Code Live Server) to avoid CORS issues.</small></div>`;
                        return;
                    }

                    const dictData = await dictRes.json();
                    if (dictData.title === 'No Definitions Found') {
                        out.innerHTML =
                            `<div class="dict-error">Sorry, no definitions found for "${word}".<br><small>If you are running this file locally, please use a web server (e.g., VS Code Live Server) to avoid CORS issues.</small></div>`;
                        return;
                    }

                    const entry = dictData[0];
                    const phonetic = entry.phonetic || (entry.phonetics.find(p => p.text)?.text) || '';
                    let html = `
                        <div class="dict-top-section">
                            <div class="dict-word-container">
                                <span class="dict-word">${entry.word}</span>
                                <div style="display:flex; align-items:center; gap:10px;">
                                    ${phonetic ? `<span class="dict-phonetic">${phonetic}</span>` : ''}
                                    <button class="pronounce-btn" onclick="speakText('${entry.word}')" title="Listen">
                                        <svg viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-4 0c-4.01.91-7 4.49-7 8.77s2.99 7.86 7 8.77v-2.06c-2.89-.86-5-3.54-5-6.71s2.11-5.85 5-6.71V3.23zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="dict-image-container ${imageUrl ? 'has-image' : ''}">
                                ${imageUrl ? `<img src="${imageUrl}" alt="${word}">` : ''}
                            </div>
                        </div>
                    `;

                    const synonyms = new Set(),
                        antonyms = new Set();
                    entry.meanings.forEach(meaning => {
                        meaning.synonyms.forEach(s => synonyms.add(s));
                        meaning.antonyms.forEach(a => antonyms.add(a));
                        html += `
                            <div class="dict-pos-group">
                                <span class="dict-pos">${meaning.partOfSpeech}</span>
                                <ul class="dict-def-list">
                                    ${meaning.definitions.slice(0, 3).map(def =>
                                        `<li>${def.definition}${def.example ? `<span class="dict-example">"${def.example}"</span>` : ''}</li>`
                                    ).join('')}
                                </ul>
                            </div>
                        `;
                    });

                    if (entry.origin) html +=
                        `<div class="dict-extra-info"><span class="dict-label">Etymology:</span> ${entry.origin}</div>`;
                    if (synonyms.size) html +=
                        `<div class="dict-extra-info"><span class="dict-label">Synonyms:</span> <div class="tag-cloud">${Array.from(synonyms).slice(0,5).map(s => `<span class="tag">${s}</span>`).join('')}</div></div>`;
                    if (antonyms.size) html +=
                        `<div class="dict-extra-info"><span class="dict-label">Antonyms:</span> <div class="tag-cloud">${Array.from(antonyms).slice(0,5).map(a => `<span class="tag">${a}</span>`).join('')}</div></div>`;

                    out.innerHTML = html;
                } catch (err) {
                    out.innerHTML =
                        `<div class="dict-error">Network error. Please check your connection.<br><small>If you are running this file locally, please use a web server (e.g., VS Code Live Server) to avoid CORS issues.</small></div>`;
                    console.error(err);
                }
            }

            function switchTabAndSearch(word) {
                tabButtons.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                document.querySelector('[data-tab="dictionary"]').classList.add('active');
                document.getElementById('dictionary').classList.add('active');
                searchDict(word);
            }
            window.switchTabAndSearch = switchTabAndSearch;
            window.speakText = speakText;

            document.getElementById('dict-search-btn').addEventListener('click', () => searchDict());
            document.getElementById('dict-word').addEventListener('keypress', e => { if (e.key === 'Enter') searchDict(); });

            // =====================================================
            // 11. DICTATION & PDF
            // =====================================================
            const startRecordBtn = document.getElementById('start-record-btn');
            const stopRecordBtn = document.getElementById('stop-record-btn');
            const dictationStatus = document.getElementById('dictation-status');
            const dictationArea = document.getElementById('dictation-area');
            const savePdfBtn = document.getElementById('save-pdf-btn');
            const recordingIndicator = document.querySelector('.recording-indicator');

            let recognition = null;
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                recognition = new(window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    startRecordBtn.style.display = 'none';
                    stopRecordBtn.style.display = 'flex';
                    dictationStatus.textContent = 'Listening...';
                    recordingIndicator.classList.add('active');
                };
                recognition.onend = () => {
                    startRecordBtn.style.display = 'flex';
                    stopRecordBtn.style.display = 'none';
                    dictationStatus.textContent = '';
                    recordingIndicator.classList.remove('active');
                };
                recognition.onerror = (ev) => {
                    dictationStatus.textContent = 'Error: ' + ev.error;
                    stopRecordBtn.click();
                };
                recognition.onresult = (ev) => {
                    let final = '';
                    for (let i = ev.resultIndex; i < ev.results.length; i++) {
                        if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
                    }
                    if (final) {
                        const current = dictationArea.value;
                        dictationArea.value = current + (current && !current.endsWith(' ') ? ' ' : '') + final;
                    }
                };
            } else {
                startRecordBtn.disabled = true;
                dictationStatus.textContent = 'Speech Recognition not supported in this browser.';
            }

            startRecordBtn.addEventListener('click', () => { if (recognition) recognition.start(); });
            stopRecordBtn.addEventListener('click', () => { if (recognition) recognition.stop(); });

            savePdfBtn.addEventListener('click', () => {
                const text = dictationArea.value;
                if (!text) { alert('Please dictate or write some text first.'); return; }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const margin = 15;
                const maxWidth = doc.internal.pageSize.getWidth() - (margin * 2);
                doc.setFontSize(16);
                doc.text('Dictation Result', margin, 20);
                doc.setFontSize(12);
                const lines = doc.splitTextToSize(text, maxWidth);
                doc.text(lines, margin, 35);
                doc.save('dictation-output.pdf');
            });

            // =====================================================
            // 12. FLASHCARDS
            // =====================================================
            let currentCardWord = '';
            const flashcard = document.getElementById('flashcard');
            const fcFront = document.getElementById('fc-front-word');
            const fcBack = document.getElementById('fc-back-def');
            const fcFlip = document.getElementById('fc-flip-btn');
            const fcNext = document.getElementById('fc-next-btn');

            function getRandomWord() {
                const all = [...A1_WORDS, ...A2_WORDS];
                return all[Math.floor(Math.random() * all.length)];
            }

            async function fetchDefinitionForCard(word) {
                fcBack.innerHTML = '<div class="spinner"></div>';
                try {
                    const url = CORS_PROXY + encodeURIComponent(
                        `https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                    const res = await fetch(url);
                    if (!res.ok) {
                        fcBack.innerHTML =
                            `<em>Definition not found for "${word}".<br><small>Try another word.</small></em>`;
                        return;
                    }
                    const data = await res.json();
                    if (data.title === 'No Definitions Found' || !data[0]) {
                        fcBack.innerHTML =
                            `<em>Definition not found for "${word}".<br><small>Try another word.</small></em>`;
                        return;
                    }
                    const entry = data[0];
                    const phonetic = entry.phonetic || (entry.phonetics.find(p => p.text)?.text) || '';
                    const defs = entry.meanings.map(m =>
                        `<strong>${m.partOfSpeech}</strong>: ${m.definitions[0].definition}`
                    ).join('<br><br>');
                    fcBack.innerHTML = `
                        <div style="margin-bottom:10px; color:var(--text-muted);">${phonetic}</div>
                        <div style="text-align:left; font-size:1rem;">${defs}</div>
                    `;
                } catch (_) {
                    fcBack.innerHTML =
                        'Error fetching definition. <br><small>Try again or use a web server (e.g., Live Server) to avoid CORS.</small>';
                }
            }

            fcFlip.addEventListener('click', () => flashcard.classList.toggle('flipped'));
            fcNext.addEventListener('click', () => {
                flashcard.classList.remove('flipped');
                const word = getRandomWord();
                setTimeout(() => {
                    currentCardWord = word;
                    fcFront.textContent = word;
                    fetchDefinitionForCard(word);
                }, 300);
            });

            // initial
            fcNext.click();

        }); // end DOMContentLoaded
    </script>
</body>
</html>
